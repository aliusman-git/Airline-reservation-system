<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airline Reservation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">
<style>
:root{--primary:#0e7490;--primary-dark:#164e63;--accent:#f59e0b;--background:#ecfeff;--text:#0f172a;--danger:#dc2626}
[data-theme="sunset"]{--primary:#c2410c;--primary-dark:#7c2d12;--accent:#eab308;--background:#fff7ed}
[data-theme="royal"]{--primary:#6d28d9;--primary-dark:#4c1d95;--accent:#f472b6;--background:#f5f3ff}
[data-theme="forest"]{--primary:#15803d;--primary-dark:#14532d;--accent:#f59e0b;--background:#f0fdf4}
body{font-family:system-ui,sans-serif;margin:0;background:var(--background);color:var(--text)}
header{background:linear-gradient(90deg,var(--primary-dark),var(--primary));color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0003}
header #logout{background:#ffffff26;border:1px solid #fff6}
main{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 20%,transparent);border-top:4px solid var(--accent)}
h2{color:var(--primary-dark)}
input,select,button{padding:9px 12px;margin:4px 4px 4px 0;border:1px solid color-mix(in srgb,var(--primary) 35%,white);border-radius:6px;font-size:14px}
input:focus,select:focus{outline:2px solid var(--primary);border-color:var(--primary)}
button{background:var(--primary);color:#fff;border:0;cursor:pointer;transition:background .2s}
button:hover{background:var(--primary-dark)}
button.danger{background:var(--danger)}
table{width:100%;border-collapse:collapse}
th{background:color-mix(in srgb,var(--primary) 15%,white);color:var(--primary-dark)}
th,td{text-align:left;padding:8px;border-bottom:1px solid color-mix(in srgb,var(--primary) 15%,white);font-size:14px}
tr:hover td{background:color-mix(in srgb,var(--primary) 6%,white)}
#seats button{width:58px;background:color-mix(in srgb,var(--primary) 12%,white);color:var(--primary-dark);border:1px solid color-mix(in srgb,var(--primary) 45%,white)}
#seats button.business{background:#fef3c7;border-color:var(--accent)}
#seats button.chosen{background:var(--primary);color:#fff;border-color:var(--primary)}
#message{position:fixed;top:12px;right:12px;padding:10px 16px;border-radius:6px;color:#fff;display:none;box-shadow:0 2px 8px #0004}
.hidden{display:none}
.palette{display:flex;align-items:center}
.swatch{width:22px;height:22px;padding:0;margin:0 3px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.auth{max-width:380px;margin:40px auto;text-align:center;animation:slideUp .6s ease-out}
.auth input,.auth button{width:100%;box-sizing:border-box;margin:6px 0;padding:11px 12px}
.auth input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent)}
.auth button{font-weight:600;transition:all .2s}
.auth button:hover{transform:translateY(-2px);box-shadow:0 4px 10px color-mix(in srgb,var(--primary) 35%,transparent)}
.plane{font-size:44px;display:inline-block;animation:fly 3s ease-in-out infinite}
.tabs{display:flex;margin:8px 0 14px;border-bottom:2px solid color-mix(in srgb,var(--primary) 15%,white)}
.auth .tab{flex:1;background:none;color:#64748b;border-radius:6px 6px 0 0;margin:0}
.auth .tab:hover{transform:none;box-shadow:none;background:color-mix(in srgb,var(--primary) 6%,white);color:var(--primary-dark)}
.auth .tab.active{color:var(--primary-dark);box-shadow:inset 0 -3px 0 var(--primary)}
.password-row{display:flex;align-items:center;gap:6px}
.password-row input{width:auto;flex:1;min-width:0}
.auth .password-row .ghost{width:auto;flex:none;background:color-mix(in srgb,var(--primary) 12%,white);color:var(--primary-dark);padding:8px 12px}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes fly{0%,100%{transform:translate(-8px,2px) rotate(-6deg)}50%{transform:translate(8px,-6px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.plane,.auth{animation:none}}
</style>
</head>
<body>
<header>
  <strong>Airline Reservation</strong>
  <span class="palette">
    <button class="swatch" style="background:#0e7490" title="Teal" onclick="setTheme('teal')"></button>
    <button class="swatch" style="background:#c2410c" title="Sunset" onclick="setTheme('sunset')"></button>
    <button class="swatch" style="background:#6d28d9" title="Royal" onclick="setTheme('royal')"></button>
    <button class="swatch" style="background:#15803d" title="Forest" onclick="setTheme('forest')"></button>
  </span>
  <span><span id="who"></span> <button id="logout" class="hidden" onclick="logout()">Logout</button></span>
</header>
<div id="message"></div>
<main>
  <section id="authSection" class="card auth">
    <div class="plane">&#9992;</div>
    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="showTab('login')">Login</button>
      <button id="registerTab" class="tab" onclick="showTab('register')">Create account</button>
    </div>
    <div id="registerFields" class="hidden">
      <input id="fullName" placeholder="Full name">
      <input id="phone" placeholder="Phone">
    </div>
    <input id="email" type="email" placeholder="Email">
    <div class="password-row">
      <input id="password" type="password" placeholder="Password (min 8 characters)">
      <button type="button" id="showPassword" class="ghost" onclick="togglePassword()">Show</button>
    </div>
    <input id="confirmPassword" type="password" placeholder="Confirm password" class="hidden">
    <button id="loginButton" onclick="login()">Login</button>
    <button id="registerButton" class="hidden" onclick="registerAccount()">Create account</button>
  </section>
  <div id="appSection" class="hidden">
    <section class="card">
      <h2>Search flights</h2>
      <select id="origin"></select>
      <select id="destination"></select>
      <input id="travelDate" type="date">
      <button onclick="searchFlights()">Search</button>
      <table><tbody id="results"></tbody></table>
    </section>
    <section class="card">
      <h2>Upcoming flights</h2>
      <table><tbody id="upcoming"></tbody></table>
    </section>
    <section id="seatCard" class="card hidden">
      <h2 id="seatTitle">Choose your seat</h2>
      <p>Yellow seats are Business class. Hover a seat to see its price.</p>
      <div id="seats"></div>
      <p id="selection"></p>
      <label>Pay with: <select id="paymentMethod"><option>Card</option><option>JazzCash</option><option>Easypaisa</option><option>Bank Transfer</option></select></label>
      <p><small>Demo payment only. No real money is charged and no card details are stored.</small></p>
      <button onclick="confirmBooking()">Pay and confirm booking</button>
    </section>
    <section class="card">
      <h2>My bookings</h2>
      <table><tbody id="bookings"></tbody></table>
    </section>
  </div>
</main>
<script>
let selectedFlightId = null;
let selectedSeat = null;
const byId = id => document.getElementById(id);
const showTime = text => String(text).replace('T', ' ');
function notify(text, isError) {
  const box = byId('message');
  box.textContent = text;
  box.style.background = isError ? '#d64545' : '#2e9e5b';
  box.style.display = 'block';
  setTimeout(() => box.style.display = 'none', 3500);
}
async function api(path, method = 'GET', body) {
  const response = await fetch('/api' + path, {
    method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
async function run(action) {
  try { await action(); } catch (error) { notify(error.message, true); }
}
function showUser(user) {
  const loggedIn = !!user;
  byId('authSection').classList.toggle('hidden', loggedIn);
  byId('appSection').classList.toggle('hidden', !loggedIn);
  byId('logout').classList.toggle('hidden', !loggedIn);
  byId('who').textContent = loggedIn ? (user.FullName || user.Email) : '';
  if (loggedIn) { loadAirports(); loadBookings(); }
  else { byId('password').value = ''; byId('confirmPassword').value = ''; showTab('login'); }
}
const login = () => run(async () => {
  showUser(await api('/login', 'POST', {email: byId('email').value, password: byId('password').value}));
});
const registerAccount = () => run(async () => {
  if (byId('password').value !== byId('confirmPassword').value) throw new Error('Passwords do not match.');
  await api('/register', 'POST', {fullName: byId('fullName').value, phone: byId('phone').value,
    email: byId('email').value, password: byId('password').value});
  notify('Account created. Logging you in...');
  await login();
});
const logout = () => run(async () => { await api('/logout', 'POST'); showUser(null); });
const loadAirports = () => run(async () => {
  const airports = await api('/airports');
  const options = airports.map(a => `<option value="${a.AirportCode}">${a.City} (${a.AirportCode})</option>`).join('');
  byId('origin').innerHTML = options;
  byId('destination').innerHTML = options;
  byId('destination').selectedIndex = 1;
});
const searchFlights = () => run(async () => {
  const query = `origin=${byId('origin').value}&destination=${byId('destination').value}&date=${byId('travelDate').value}`;
  const flights = await api('/flights?' + query);
  byId('results').innerHTML = flights.length === 0 ? '<tr><td>No flights found for this route and date.</td></tr>'
    : '<tr><th>Flight</th><th>Departs</th><th>Arrives</th><th>From PKR</th><th>Free seats</th><th></th></tr>' +
      flights.map(f => `<tr><td>${f.FlightNumber}</td><td>${showTime(f.DepartureTime)}</td><td>${showTime(f.ArrivalTime)}</td>
        <td>${f.BasePrice}</td><td>${f.AvailableSeats}</td>
        <td><button onclick="chooseSeat(${f.FlightID}, '${f.FlightNumber}')">Choose seat</button></td></tr>`).join('');
});
const loadUpcoming = () => run(async () => {
  const flights = await api('/flights/upcoming');
  byId('upcoming').innerHTML = flights.length === 0 ? '<tr><td>No upcoming flights.</td></tr>'
    : '<tr><th>Flight</th><th>Route</th><th>Departs</th><th>From PKR</th><th>Free seats</th><th></th></tr>' +
      flights.map(f => `<tr><td>${f.FlightNumber}</td><td>${f.OriginCode} to ${f.DestinationCode}</td><td>${showTime(f.DepartureTime)}</td>
        <td>${f.BasePrice}</td><td>${f.AvailableSeats}</td>
        <td><button onclick="chooseSeat(${f.FlightID}, '${f.FlightNumber}')">Choose seat</button></td></tr>`).join('');
});
const chooseSeat = (flightId, flightNumber) => run(async () => {
  selectedFlightId = flightId;
  selectedSeat = null;
  byId('selection').textContent = '';
  byId('seatTitle').textContent = 'Choose your seat on ' + flightNumber;
  const seats = await api(`/flights/${flightId}/seats`);
  byId('seats').innerHTML = seats.map(s =>
    `<button class="${s.SeatClass === 'Business' ? 'business' : ''}" title="PKR ${s.Price}"
      onclick="selectSeat(this, '${s.SeatNumber}', ${s.Price})">${s.SeatNumber}</button>`).join('');
  byId('seatCard').classList.remove('hidden');
  byId('seatCard').scrollIntoView({behavior: 'smooth'});
});
function selectSeat(button, seatNumber, price) {
  document.querySelectorAll('#seats button').forEach(b => b.classList.remove('chosen'));
  button.classList.add('chosen');
  selectedSeat = seatNumber;
  byId('selection').textContent = `Seat ${seatNumber} - PKR ${price}`;
}
const confirmBooking = () => run(async () => {
  if (!selectedSeat) throw new Error('Please click a seat first.');
  const ticket = await api('/bookings', 'POST', {flightId: String(selectedFlightId), seatNumber: selectedSeat,
    paymentMethod: byId('paymentMethod').value});
  notify(`Paid PKR ${ticket.Price} by ${ticket.PaymentMethod}. Ref: ${ticket.PaymentReference}`);
  byId('seatCard').classList.add('hidden');
  loadBookings();
  searchFlights();
});
const loadBookings = () => run(async () => {
  const bookings = await api('/bookings/mine');
  loadUpcoming();
  byId('bookings').innerHTML = bookings.length === 0 ? '<tr><td>No bookings yet.</td></tr>'
    : '<tr><th>#</th><th>Flight</th><th>Route</th><th>Departs</th><th>Seat</th><th>Price</th><th>Status</th><th>Payment</th><th>Refund</th><th></th></tr>' +
      bookings.map(b => `<tr><td>${b.BookingID}</td><td>${b.FlightNumber}</td><td>${b.OriginCode} to ${b.DestinationCode}</td>
        <td>${showTime(b.DepartureTime)}</td><td>${b.SeatNumber}</td><td>${b.Price}</td><td>${b.BookingStatus}</td>
        <td>${b.PaymentMethod ?? '-'}</td><td>${b.RefundAmount ?? ''}</td>
        <td>${b.BookingStatus === 'Confirmed' ? `<button class="danger" onclick="cancelBooking(${b.BookingID}, ${b.ExpectedRefund ?? 0})">Cancel</button>` : ''}</td></tr>`).join('');
});
const cancelBooking = (bookingId, expectedRefund) => run(async () => {
  if (!confirm(`Cancel this booking? You will get PKR ${expectedRefund} back.`)) return;
  const result = await api(`/bookings/${bookingId}/cancel`, 'POST');
  notify(`Booking cancelled. Refund: PKR ${result.RefundAmount}`);
  loadBookings();
});
function showTab(tabName) {
  const registering = tabName === 'register';
  byId('confirmPassword').classList.toggle('hidden', !registering);
  byId('registerFields').classList.toggle('hidden', !registering);
  byId('loginButton').classList.toggle('hidden', registering);
  byId('registerButton').classList.toggle('hidden', !registering);
  byId('loginTab').classList.toggle('active', !registering);
  byId('registerTab').classList.toggle('active', registering);
}
function togglePassword() {
  const showing = byId('password').type === 'text';
  const newType = showing ? 'password' : 'text';
  byId('password').type = newType;
  byId('confirmPassword').type = newType;
  byId('showPassword').textContent = showing ? 'Show' : 'Hide';
}
function setTheme(themeName) {
  document.documentElement.dataset.theme = themeName;
  try { localStorage.setItem('theme', themeName); } catch (error) {}
}
let savedTheme = 'teal';
try { savedTheme = localStorage.getItem('theme') || 'teal'; } catch (error) {}
setTheme(savedTheme);
byId('travelDate').valueAsDate = new Date(Date.now() + 8 * 86400000);
api('/me').then(showUser).catch(() => showUser(null));
</script>
</body>
</html>
